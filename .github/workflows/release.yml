name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  make:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # CLAUDE.md's known gotcha: `npm run make` needs Node 22 — a
      # bleeding-edge default `node` (observed: v26) makes electron-packager's
      # zip extraction fail silently with no `out/` produced at all.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same workaround CI (ci.yml) uses: the Forge lockfile resolves
      # @electron/node-gyp over git+ssh, which an unauthenticated runner
      # can't clone.
      - name: Use HTTPS for git dependencies
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      # macOS: plain `npm ci` is fine — GitHub's macos-latest runner ships
      # with Xcode's license already accepted, so better-sqlite3's implicit
      # node-gyp rebuild (see below) succeeds there without help.
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: npm ci

      # Windows: same bug ci.yml already works around. better-sqlite3 ships
      # a binding.gyp with no explicit install script, so npm's own
      # convention auto-runs `node-gyp rebuild` for it on every `npm ci` —
      # via the Electron-flavored node-gyp this project's Forge toolchain
      # hoists into node_modules/.bin — and that fails on windows-latest
      # because its version-detection table doesn't recognize the runner's
      # installed Visual Studio version. The rebuild is unneeded either way
      # (better-sqlite3 already ships a matching prebuilt binary). Unlike
      # ci.yml, this job actually needs *some* install scripts to run
      # (esbuild's platform binary for the Vite build, electron-winstaller's
      # 7z-arch selection for the Squirrel maker) — so it's `--ignore-scripts`
      # followed by a targeted rebuild of just those two, rather than a
      # blanket skip.
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild electron-winstaller

      # Windows only ever runs one maker here (MakerSquirrel — MakerZIP is
      # scoped to darwin in forge.config.ts, MakerDMG defaults to
      # darwin/mas), so a single `make` is safe: there's no sibling maker
      # for a failure to take down.
      - name: Make installer (Windows)
        if: runner.os == 'Windows'
        run: npm run make

      # macOS runs zip and dmg together. Forge's `make()` runs every
      # matched maker in one process and an unhandled rejection from any
      # one of them (observed locally: dmg, when the machine's Xcode
      # license isn't accepted) aborts the whole thing before a sibling
      # maker's in-flight output finishes writing — a combined run can
      # come out of `out/make/zip` empty even though zip's own step never
      # itself errored. Separate `--targets` invocations isolate them: zip
      # always has to succeed (it's simple, dependency-free, and this job
      # shouldn't ship nothing if it fails), dmg is best-effort so one
      # macOS-specific dmg hiccup can't erase an already-built zip.
      - name: Make zip (macOS)
        if: runner.os == 'macOS'
        run: npx electron-forge make --targets=@electron-forge/maker-zip

      - name: Make dmg (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: npx electron-forge make --targets=@electron-forge/maker-dmg

      - name: Upload to GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            out/make/squirrel.windows/**/*.exe
            out/make/squirrel.windows/**/*.nupkg
            out/make/squirrel.windows/**/RELEASES
            out/make/**/*.dmg
            out/make/zip/**/*.zip
